[project]
name = "claude-agent-from-scratch"
version = "1.0.0"
description = "A ReAct agent built from scratch on the Claude API: streaming tool use, memory, Supabase, safe tools."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Aurimas A. Nausedas" }]
dependencies = [
    "anthropic>=1.11,<2",
    "fastapi>=0.120",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.9"]
notebook = ["jupyter>=1.1", "python-dotenv>=1.0"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "ASYNC"]
ignore = ["S101", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
